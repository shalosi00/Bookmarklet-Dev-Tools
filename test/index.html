<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pocket DevTools Test Page</title>
<style>
  body { font-family: sans-serif; margin: 0; padding: 16px; background: #f5f5f0; color: #222; }
  .box { background: #4a90d9; color: #fff; padding: 24px; margin: 16px 0; border-radius: 8px; }
  .box.warn { background: #d97706; }
  .card { border: 1px solid #ccc; padding: 12px; border-radius: 6px; background: #fff; }
  #target { border: 3px solid #333; padding: 20px; margin: 10px 0; }
  img { max-width: 100px; display: block; margin: 8px 0; }
</style>
</head>
<body>
<h1>Test Page</h1>
<div class="box" id="main-box">Main box <span id="inner">inner span</span></div>
<div class="box warn">Warning box with <a href="#link">a link</a></div>
<div id="target" class="card" data-role="target" data-state="off">
  <p>Tap target element</p>
  <ul><li>one</li><li>two</li><li>three</li></ul>
</div>
<img src="broken-image.png" alt="broken image">
<button id="net-btn">Fire requests</button>
<button id="err-btn">Throw error</button>
<script>
  /* test data */
  localStorage.setItem('test-ls', JSON.stringify({ hello: 'world', n: 42 }));
  sessionStorage.setItem('test-ss', 'session-value');
  document.cookie = 'test-cookie=pocketdevtools; path=/';
  console.log('page log: test page loaded');
  console.warn('page warning: something suspicious');
  console.info('page info: informational');

  document.getElementById('net-btn').addEventListener('click', function () {
    fetch('missing-fetch-target.json').catch(function () {});
    var x = new XMLHttpRequest();
    x.open('GET', 'missing-xhr-target.xml');
    x.setRequestHeader('X-Test', 'pdt');
    x.send();
    console.log('requests fired');
  });
  document.getElementById('err-btn').addEventListener('click', function () {
    setTimeout(function () { throw new Error('deliberate test error'); }, 0);
    Promise.reject(new Error('unhandled rejection test'));
  });
</script>
</body>
</html>
